[settings]
all_compile = false
cargo.binstall_native = true
idiomatic_version_file_enable_tools = ["node", "pnpm", "python", "ruff", "rust"]
npm.package_manager = "npm"

[tool_alias]
toolconfig = "github:mathematic-inc/toolconfig"

[tools]
ghalint = "1.6.0"
gitleaks = "8.30.1"
go = "1.27.3"
hadolint = "2.15.1"
harper-cli = "3.3.0"
hk = "2.13.0"
jactionlint = "2.6.0"
jq = "1.8.2"
lychee = "0.24.2"
oxfmt = "0.79.0"
pinact = "5.0.2"
python = "3.15.2"
ripgrep = "15.2.0"
rumdl = "0.3.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.11.3"
toolconfig = "2026.11.6"
typos = "1.52.2"
uv = "0.13.7"
zizmor = "1.32.0"
"aqua:anordal/shellharden" = "4.3.2"
"aqua:apple/pkl" = "0.33.1"
"aqua:owenlamont/ryl" = "0.30.0"
"github:mongodb/kingfisher" = "2.19.1"

[tasks.generate]
description = "Write the files that ToolConfig generates"
run = "toolconfig generate --strict"

[tasks.fix]
description = "Fix the files that a tool can fix"
run = "hk fix --all"

[tasks.check]
description = "Check the repository"
run = ["toolconfig check --strict", "hk check --all --slow"]
