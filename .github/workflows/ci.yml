name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Run checks
        run: hk check --all --slow
      - name: Verify release version injection
        run: |
          go build -ldflags "-X main.version=ci" -o "$RUNNER_TEMP/claude-tools-mcp" ./cmd/claude-tools-mcp
          test "$("$RUNNER_TEMP/claude-tools-mcp" --version)" = "claude-tools-mcp version ci"

  docker:
    name: Docker
    needs:
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --file Dockerfile --tag claude-tools-mcp:pr .
