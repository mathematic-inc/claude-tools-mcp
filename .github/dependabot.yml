version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
